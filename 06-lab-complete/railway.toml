# Railway: build bằng Dockerfile, PORT do Railway cấp (CMD dùng ${PORT:-8000}).
# Biến đặt trên dashboard / `railway variables`: AGENT_API_KEY, REDIS_URL (tham chiếu service Redis),
# ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
